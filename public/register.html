<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Bridge — สมัครสมาชิก</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e1a;--card:rgba(255,255,255,0.05);--glass:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.1);--text:#e2e8f0;--muted:#94a3b8;
  --brand:#6366f1;--brand-glow:rgba(99,102,241,0.4);
  --accent:#22d3ee;--accent-glow:rgba(34,211,238,0.3);
  --success:#10b981;--danger:#ef4444;
}
body{
  min-height:100vh;font-family:'Inter','Noto Sans Thai',sans-serif;
  background:var(--bg);color:var(--text);display:flex;align-items:center;
  justify-content:center;overflow:hidden;
}
body::before{
  content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(circle at 30% 40%,rgba(99,102,241,0.15),transparent 50%),
  radial-gradient(circle at 70% 60%,rgba(34,211,238,0.1),transparent 50%),
  radial-gradient(circle at 50% 50%,rgba(139,92,246,0.08),transparent 60%);
  animation:bgFloat 20s ease-in-out infinite;z-index:0;
}
@keyframes bgFloat{
  0%,100%{transform:translate(0,0) rotate(0deg)}
  25%{transform:translate(2%,-2%) rotate(1deg)}
  50%{transform:translate(-1%,3%) rotate(-1deg)}
  75%{transform:translate(3%,1%) rotate(0.5deg)}
}
.login-card{
  position:relative;z-index:1;width:440px;max-width:92vw;
  background:var(--glass);backdrop-filter:blur(24px);
  border:1px solid var(--border);border-radius:24px;padding:44px 40px;
  box-shadow:0 32px 64px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.1);
}
.logo{text-align:center;margin-bottom:28px}
.logo h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--brand),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.5px}
.logo p{color:var(--muted);font-size:13px;margin-top:6px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px}
.form-group input,.form-group select{
  width:100%;padding:12px 16px;background:rgba(255,255,255,0.06);
  border:1px solid var(--border);border-radius:12px;color:var(--text);
  font-size:15px;font-family:inherit;outline:none;transition:all .3s;
}
.form-group select option{background:#1e293b;color:var(--text)}
.form-group input:focus,.form-group select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-glow)}
.form-group input::placeholder{color:rgba(148,163,184,0.5)}
.row{display:flex;gap:12px}
.row .form-group{flex:1}
.btn{
  width:100%;padding:14px;background:linear-gradient(135deg,var(--brand),#8b5cf6);
  border:none;border-radius:12px;color:white;font-size:15px;font-weight:600;
  font-family:inherit;cursor:pointer;transition:all .3s;position:relative;overflow:hidden;
  margin-top:8px;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px var(--brand-glow)}
.btn:active{transform:translateY(0)}
.btn.loading{pointer-events:none;opacity:0.7}
.divider{text-align:center;margin:20px 0;position:relative}
.divider::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:var(--border)}
.divider span{padding:0 12px;font-size:12px;color:var(--muted);position:relative}
.link{text-align:center;margin-top:16px;font-size:14px;color:var(--muted)}
.link a{color:var(--accent);text-decoration:none;font-weight:500;transition:color .2s}
.link a:hover{color:var(--brand)}
.alert{
  padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:16px;
  display:none;animation:fadeIn .3s;
}
.alert.error{background:rgba(239,68,68,0.15);color:#fca5a5;border:1px solid rgba(239,68,68,0.2);display:block}
.alert.success{background:rgba(16,185,129,0.15);color:#6ee7b7;border:1px solid rgba(16,185,129,0.2);display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.floating-orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:0.3;animation:orbFloat 15s ease-in-out infinite;z-index:0}
.orb1{width:300px;height:300px;background:var(--brand);top:10%;right:10%;animation-delay:-5s}
.orb2{width:200px;height:200px;background:var(--accent);bottom:20%;left:15%;animation-delay:-10s}
@keyframes orbFloat{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-30px)}}
</style>
</head>
<body>
<div class="floating-orb orb1"></div>
<div class="floating-orb orb2"></div>
<div class="login-card">
  <div class="logo">
    <h1>🎓 Skill Bridge</h1>
    <p>สร้างบัญชีใหม่สำหรับครู / แอดมิน</p>
  </div>
  <div id="alert" class="alert"></div>
  <form id="regForm" onsubmit="return handleRegister(event)">
    <div class="form-group">
      <label>ชื่อ-นามสกุล</label>
      <input type="text" id="displayName" placeholder="เช่น อ.สมศรี รักเรียน" required>
    </div>
    <div class="row">
      <div class="form-group">
        <label>ชื่อผู้ใช้</label>
        <input type="text" id="username" placeholder="username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>บทบาท</label>
        <select id="role">
          <option value="teacher">ครู</option>
          <option value="admin">แอดมิน</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>รหัสผ่าน</label>
      <input type="password" id="password" placeholder="อย่างน้อย 6 ตัวอักษร" required minlength="6" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label>ยืนยันรหัสผ่าน</label>
      <input type="password" id="confirmPassword" placeholder="พิมพ์รหัสผ่านอีกครั้ง" required autocomplete="new-password">
    </div>
    <button type="submit" class="btn" id="regBtn">สมัครสมาชิก</button>
  </form>
  <div class="divider"><span>หรือ</span></div>
  <div class="link">มีบัญชีแล้ว? <a href="/login.html">เข้าสู่ระบบ</a></div>
</div>
<script>
async function handleRegister(e) {
  e.preventDefault();
  const alert = document.getElementById('alert');
  const btn = document.getElementById('regBtn');
  const pw = document.getElementById('password').value;
  const cpw = document.getElementById('confirmPassword').value;
  if (pw !== cpw) {
    alert.className = 'alert error';
    alert.textContent = 'รหัสผ่านไม่ตรงกัน';
    return false;
  }
  btn.classList.add('loading'); btn.textContent = '';
  alert.className = 'alert';
  try {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        displayName: document.getElementById('displayName').value,
        username: document.getElementById('username').value,
        password: pw,
        role: document.getElementById('role').value
      })
    });
    const data = await res.json();
    if (res.ok) {
      alert.className = 'alert success';
      alert.textContent = 'สมัครสำเร็จ! กำลังไปหน้าเข้าสู่ระบบ...';
      setTimeout(() => window.location.href = '/login.html', 1200);
    } else {
      alert.className = 'alert error';
      alert.textContent = data.error || 'สมัครไม่สำเร็จ';
    }
  } catch (err) {
    alert.className = 'alert error';
    alert.textContent = 'เชื่อมต่อ server ไม่ได้';
  }
  btn.classList.remove('loading'); btn.textContent = 'สมัครสมาชิก';
}
</script>
</body>
</html>
